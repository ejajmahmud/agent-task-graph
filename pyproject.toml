[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-graph"
version = "0.1.0"
description = "Topological DAG workflow scheduler resolving task dependencies and executing tasks in parallel"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-task-graph = "agent_task_graph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_task_graph*"]
